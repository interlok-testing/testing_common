def saveLicenseFile = tasks.register('saveLicenseFile') {
    doLast {
        def outputFile = file("$buildDir/distribution/config/license.properties")
        outputFile.write("adp.license.key=${project.license}")
    }
}

tasks.named('functionalTest') {
    if (project.hasProperty('license') && project.license) {
        dependsOn tasks.named('saveLicenseFile')
        mustRunAfter('installDist')
    }
    systemProperty 'adp.license.location', 'config/license.properties'
}